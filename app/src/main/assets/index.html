<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#182a48">
<title>SUPER NIKOLIO — Ереванские приключения</title>
<style>
:root{--gold:#ffc974;--pale:#fff8e7;--navy:#192d50;--deep:#101b32;--card:rgba(18,30,53,.93);--shadow:0 17px 55px rgba(12,15,29,.37)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#111e34;color:#fff9e9;font-family:Arial,'Helvetica Neue',sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
#viewport{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#121f34}
#stage{width:1280px;height:720px;position:absolute;transform-origin:center;overflow:hidden;background:#65a8e0}
#game{display:block;width:1280px;height:720px}
#overlay{position:absolute;inset:0;display:flex;justify-content:flex-start;align-items:center;padding:30px 82px;background:linear-gradient(90deg,rgba(12,22,42,.66),rgba(17,27,45,.30) 57%,rgba(15,26,43,.13));transition:opacity .17s}
#overlay.hidden{pointer-events:none;opacity:0}
.panel{min-width:510px;max-width:640px;padding:21px 34px 22px;border:2px solid rgba(255,205,127,.38);border-radius:26px;background:var(--card);box-shadow:var(--shadow);backdrop-filter:blur(7px)}
.brand{letter-spacing:2.5px;text-transform:uppercase;color:#ffd997;font-weight:900;font-size:16px;margin:0 0 7px}.hero-title{font-size:58px;line-height:.99;font-weight:1000;letter-spacing:1px;margin:2px 0 9px;color:#fff1cf;text-shadow:0 3px 0 #925f43}.sub{font-size:21px;line-height:1.34;color:#f3d7b4;margin:6px 0 15px}.level-title{font-size:44px;font-weight:950;line-height:1.08;margin:2px 0 16px;color:#fff2cf}
.menu{display:flex;flex-direction:column;gap:7px}.menu button{appearance:none;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 17px;text-align:left;color:#fffaf0;font-size:22px;font-weight:700;cursor:pointer;min-height:51px;outline:none}.menu button.selected,.menu button:focus-visible{background:linear-gradient(90deg,#ffe2a3,#f5b75d);border-color:#fff2cd;color:#1d3150;box-shadow:0 0 0 3px rgba(255,255,255,.20);transform:translateX(3px)}.menu button:disabled{opacity:.44;cursor:not-allowed}.muted{font-size:15px;color:#f5dabc;line-height:1.35;margin:12px 0 0}.hint{position:absolute;right:38px;bottom:24px;padding:10px 19px;color:#fffbe9;font-size:18px;background:rgba(18,34,58,.76);border-radius:24px}.avatar{position:absolute;right:185px;bottom:119px;max-height:345px;max-width:250px;object-fit:contain;filter:drop-shadow(0 18px 20px rgba(17,22,30,.48));pointer-events:none}.flag-preview{position:absolute;right:83px;bottom:75px;width:290px;object-fit:contain;filter:drop-shadow(0 12px 19px rgba(0,0,0,.34))}
#toast{position:absolute;top:125px;left:50%;transform:translate(-50%,-20px);background:rgba(18,31,51,.92);border:2px solid #f1c27b;border-radius:30px;padding:14px 28px;color:white;font-size:23px;font-weight:800;opacity:0;transition:opacity .24s,transform .24s;pointer-events:none;text-align:center;max-width:800px}#toast.show{opacity:1;transform:translate(-50%,0)}
#mobile{display:none;pointer-events:none;position:absolute;inset:0}#mobile button{pointer-events:auto;position:absolute;border:2px solid #fee1aa;border-radius:20px;background:rgba(13,32,60,.66);color:white;font-size:38px;min-width:74px;min-height:74px}#mobile .left{bottom:30px;left:29px}#mobile .right{bottom:30px;left:116px}#mobile .jump{bottom:30px;right:124px}#mobile .fire{bottom:30px;right:29px}#mobile .pause{right:20px;top:17px;min-width:50px;min-height:50px;font-size:23px}
@media(pointer:coarse){#mobile.active{display:block}}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
<canvas id="game" width="1280" height="720" aria-label="Игра SUPER NIKOLIO"></canvas>
<div id="overlay"></div><div id="toast"></div>
<div id="mobile"><button class="left" data-key="ArrowLeft">◀</button><button class="right" data-key="ArrowRight">▶</button><button class="jump" data-key="ArrowUp">↑</button><button class="fire" data-key="Enter">●</button><button class="pause" data-key="Escape">Ⅱ</button></div>
</div></div>
<script src="game.js"></script>
</body></html>
